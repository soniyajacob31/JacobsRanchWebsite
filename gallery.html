    <link rel="stylesheet" href="styles.css" />

    <!-- JavaScript for slideshow -->
  </head>

  <body>
    <nav>
      <div class="logo">Jacob's Ranch and Stables</div>
      <div class="nav-items">

        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
      <!-- HAMBURGER (mobile only) -->
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- MOBILE MENU -->
      <div class="mobile-menu">
        <a href="index.html">Home</a>

        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>

    <section class="gallery-section">
      <h1>GALLERY</h1>
      <div class="slideshow-container">
        <!-- Slide 1 -->
        <div class="gallery-slide fade" style="display: flex">
          <img src="images/stables.jpg" alt="Gallery Image 1" />
        </div>

        <!-- Slide 2 -->
        <div class="gallery-slide fade">
          <img src="images/arena.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Slide 3 -->
        <div class="gallery-slide fade">
          <img src="images/1stSection.jpg" alt="Gallery Image 3" />
        </div>

        <!-- Slide 4 -->
        <div class="gallery-slide fade">
          <img src="images/3horse.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Slide 5 -->
        <div class="gallery-slide fade">
          <img src="images/mainBack.jpg" alt="Gallery Image 3" />
        </div>

        <!-- Slide 6 -->
        <div class="gallery-slide fade">
          <img src="images/stable.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Slide 7 -->
        <div class="gallery-slide fade">
          <img src="images/horsesClear.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Slide 8 -->
        <div class="gallery-slide fade">
          <img src="images/backClear.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Slide 9 -->
        <div class="gallery-slide fade">
          <img src="images/horsesBack.jpg" alt="Gallery Image 2" />
        </div>

        <!-- Navigation Dots -->
        <div class="dots-container">
          <span class="dot" onclick="setSlide(0)"></span>
          <span class="dot" onclick="setSlide(1)"></span>
          <span class="dot" onclick="setSlide(2)"></span>
          <span class="dot" onclick="setSlide(3)"></span>
          <span class="dot" onclick="setSlide(4)"></span>
          <span class="dot" onclick="setSlide(5)"></span>
          <span class="dot" onclick="setSlide(6)"></span>
          <span class="dot" onclick="setSlide(7)"></span>
          <span class="dot" onclick="setSlide(8)"></span>
        </div>

        <!-- Navigation Arrows -->
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
      </div>
    </section>

    <div class="copyright">
      <h1>©2025 by Jacob's Ranch and Stables. All Rights Reserved.</h1>
    </div>
    <script src="hamburger.js"></script>
